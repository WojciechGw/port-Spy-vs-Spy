name: Build and deploy web player

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Ordinary builds and tests must work without the optional XEXs.
          sparse-checkout: |
            .github
            assets
            cmake
            src
            tests
            tools
            web
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y cc65 ninja-build
      - run: cmake --preset cc65/Release -DSPY_BUILD_WEB=ON
      - run: cmake --build --preset cc65/Release
      - run: python -m pip install -r requirements-build.txt
      - run: ctest --test-dir build/cc65/release --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: spy-vs-spy-rp6502
          path: build/cc65/release/spy-vs-spy.rp6502
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/cc65/release/web

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Require GitHub Actions as the Pages source
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.getPages({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            if (data.build_type !== 'workflow') {
              core.setFailed(
                'Settings > Pages > Build and deployment > Source must be GitHub Actions. ' +
                'Deploy from a branch starts a second Jekyll deployment that can overwrite the web player. ' +
                'Change the source, then rerun this workflow.'
              );
            }
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
