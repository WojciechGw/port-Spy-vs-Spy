name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Ordinary builds and tests must work without the optional XEXs.
          sparse-checkout: |
            .github
            assets
            src
            tests
            tools
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y cc65 ninja-build
      - run: cmake --preset cc65/Release
      - run: cmake --build --preset cc65/Release
      - run: python -m pip install -r requirements-build.txt
      - run: ctest --test-dir build/cc65/release --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: spy-vs-spy-rp6502
          path: build/cc65/release/spy-vs-spy.rp6502
