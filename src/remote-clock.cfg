MEMORY {
    HOST: start = $C000, size = $1000, file = %O, fill = yes;
    TABLES: start = $D800, size = $0800, file = "%O.tables", fill = yes;
    TITLE: start = $E000, size = $03FC, file = "%O.tables", fill = yes;
    CLOCK: start = $D500, size = $0300, file = "%O.clock", fill = yes;
    MAILBOX: start = $D100, size = $0100, file = "%O.mailbox", fill = yes;
}
SEGMENTS {
    CODE: load = HOST, type = rw, align = $100;
    TABLES: load = TABLES, type = rw;
    TITLE: load = TITLE, type = rw;
    CLOCK: load = CLOCK, type = rw;
    MAILBOX: load = MAILBOX, type = rw;
}
